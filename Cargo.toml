[workspace]
members = [
    "src-tauri",
    "crates/mogan-core",
    "crates/mogan-typst",
    "crates/mogan-convert",
    "crates/mogan-bib",
    "crates/mogan-math",
    "crates/mogan-ai",
]
resolver = "2"

[workspace.package]
version = "2026.5.0"
edition = "2024"
repository = "https://github.com/acg-j/mogan-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
